packages:
  - apps/*
  - packages/*
  - packages/modules/*

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

peerDependencyRules:
  allowedVersions:
    # ioredis-mock не импортирует ioredis во время работы; мок используется только в тестах.
    ioredis-mock>ioredis: '6'
