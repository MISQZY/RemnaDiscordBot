name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Concurrency is set per job: a workflow-level cancel would also kill a deploy halfway.
permissions:
  contents: read

env:
  NODE_VERSION: 24
  REGISTRY: ghcr.io

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before setup-node: its pnpm cache needs pnpm on PATH.
      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # postinstall of @bot/db runs `prisma generate`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, unit and integration tests
        run: pnpm check

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-migrations-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: bot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bot -d bot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bot:bot@localhost:5432/bot
      SHADOW_DATABASE_URL: postgresql://bot:bot@localhost:5432/shadow
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to an empty database
        run: pnpm db:deploy

      # Fails when schema.prisma has changes without a migration.
      - name: Check the schema matches the migrations
        working-directory: packages/db
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE shadow'
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: [check, migrations]
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-build-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: bot, app: bot, target: runtime, health_port: 3001 }
          - { image: worker, app: worker, target: runtime, health_port: 3002 }
          - { image: api, app: api, target: runtime, health_port: 3000 }
          - { image: migrate, app: bot, target: migrate, health_port: 3001 }
    outputs:
      # Deploys pull exactly this build, never whatever `latest` is by then.
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short SHA
        id: sha
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pull requests only check that the images build.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases owner/repo (GHCR requires it): ghcr.io/<owner>/<repo>/<image>:latest and :<short sha>.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            APP=${{ matrix.app }}
            HEALTH_PORT=${{ matrix.health_port }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    # One server: one deploy at a time, never cancelled once started.
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    # SSH_KEY, SSH_HOST, SSH_PORT, SSH_USER and DEPLOY_PATH are repository secrets.
    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      # The job token goes over stdin (not argv): it pulls the private images and the private repo
      # (GIT_TOKEN in deploy.sh) and expires with the run. deploy.sh runs from a copy because its own
      # checkout rewrites the clone's file under the running shell.
      - name: Deploy via SSH
        env:
          GH_JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          REMOTE="read -r TOKEN && echo \"\$TOKEN\" | docker login $REGISTRY -u $(printf %q "$ACTOR") --password-stdin \
            && cd $(printf %q "$DEPLOY_PATH") \
            && SCRIPT=\$(mktemp) && cp deploy.sh \"\$SCRIPT\" \
            && GIT_TOKEN=\"\$TOKEN\" DEPLOY_REF=$GITHUB_SHA IMAGE_TAG=$(printf %q "$IMAGE_TAG") bash \"\$SCRIPT\"; \
            rc=\$?; rm -f \"\$SCRIPT\"; docker logout $REGISTRY > /dev/null; exit \$rc"
          echo "$GH_JOB_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "$REMOTE"
