# Lavalink audio node for the music module (docker compose --profile music).
# The password comes from LAVALINK_SERVER_PASSWORD (see docker-compose.yml); the bot connects with LAVALINK_NODES.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  # Plugins are downloaded on startup into /opt/Lavalink/plugins.
  # youtube-plugin: YouTube and YouTube Music (ytsearch, ytmsearch). YouTube may block servers and its terms forbid
  # such playback: set YOUTUBE_ENABLED=false to turn it off.
  # LavaSrc: Spotify, Deezer and Yandex Music (spsearch, dzsearch, ymsearch), each on with its credentials (see below).
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    sources:
      # The built-in YouTube source is deprecated in favour of the plugin above.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: false
    soundcloudSearchEnabled: true
    gc-warnings: true

# Values from the container's environment (docker-compose.yml passes them from .env): ${NAME:default}.
plugins:
  youtube:
    enabled: ${YOUTUBE_ENABLED:true}
    allowSearch: true
    clients: ["MUSIC", "ANDROID_VR", "WEB", "WEBEMBEDDED"]
  lavasrc:
    # Spotify gives no audio: its tracks play from YouTube Music, found by ISRC and then by title.
    providers:
      - "ytmsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
    # A source on without its credentials fails to start: each is on only when its variable says so.
    sources:
      spotify: ${SPOTIFY_ENABLED:false}
      deezer: ${DEEZER_ENABLED:false}
      yandexmusic: ${YANDEX_MUSIC_ENABLED:false}
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "${SPOTIFY_COUNTRY:US}"
      playlistLoadLimit: 6
      albumLoadLimit: 6
    deezer:
      arl: "${DEEZER_ARL:}"
      masterDecryptionKey: "${DEEZER_MASTER_KEY:}"
      formats: ["MP3_128", "MP3_64"]
    yandexmusic:
      accessToken: "${YANDEX_MUSIC_TOKEN:}"
      playlistLoadLimit: 1
      albumLoadLimit: 1
      artistLoadLimit: 1

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: null
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
