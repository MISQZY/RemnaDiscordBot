packages:
  - apps/*
  - packages/*
  - packages/modules/*

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

peerDependencyRules:
  allowedVersions:
    # ioredis-mock does not import ioredis at runtime; the mock is only used in tests.
    ioredis-mock>ioredis: '6'
