name: discord-bot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: migrate
    image: ${IMAGE_REPO:-discord-bot}/migrate:${IMAGE_TAG:-latest}
    profiles: [app]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@postgres:5432/${POSTGRES_DB:-bot}
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args: { APP: bot }
    image: ${IMAGE_REPO:-discord-bot}/bot:${IMAGE_TAG:-latest}
    profiles: [app]
    restart: unless-stopped
    # Forwards signals and reaps child processes (bot clusters, Prisma).
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@postgres:5432/${POSTGRES_DB:-bot}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args: { APP: worker, HEALTH_PORT: 3002 }
    image: ${IMAGE_REPO:-discord-bot}/worker:${IMAGE_TAG:-latest}
    profiles: [app]
    restart: unless-stopped
    # Forwards signals and reaps child processes (bot clusters, Prisma).
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@postgres:5432/${POSTGRES_DB:-bot}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args: { APP: api, HEALTH_PORT: 3000 }
    image: ${IMAGE_REPO:-discord-bot}/api:${IMAGE_TAG:-latest}
    profiles: [app]
    restart: unless-stopped
    # Forwards signals and reaps child processes (bot clusters, Prisma).
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@postgres:5432/${POSTGRES_DB:-bot}
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${API_PUBLISHED_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Audio node of the music module: COMPOSE_PROFILES=app,music and LAVALINK_NODES in .env.
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    profiles: [music]
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      _JAVA_OPTIONS: -Xmx${LAVALINK_MEMORY:-512M}
      # Sources of the plugins (docker/lavalink/application.yml); only these, not the bot's whole .env.
      YOUTUBE_ENABLED: ${YOUTUBE_ENABLED:-true}
      YOUTUBE_OAUTH: ${YOUTUBE_OAUTH:-false}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YOUTUBE_CIPHER_URL: ${YOUTUBE_CIPHER_URL:-http://yt-cipher:8001}
      SPOTIFY_ENABLED: ${SPOTIFY_ENABLED:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_COUNTRY: ${SPOTIFY_COUNTRY:-US}
      DEEZER_ENABLED: ${DEEZER_ENABLED:-false}
      DEEZER_ARL: ${DEEZER_ARL:-}
      DEEZER_MASTER_KEY: ${DEEZER_MASTER_KEY:-}
      YANDEX_MUSIC_ENABLED: ${YANDEX_MUSIC_ENABLED:-false}
      YANDEX_MUSIC_TOKEN: ${YANDEX_MUSIC_TOKEN:-}
    volumes:
      - ./docker/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    ports:
      - "127.0.0.1:2333:2333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: $${LAVALINK_SERVER_PASSWORD}\" http://127.0.0.1:2333/version || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  # Deciphers YouTube stream signatures for the youtube plugin (remoteCipher in docker/lavalink/application.yml): the
  # plugin no longer does it itself. Reached by Lavalink only, inside this network, so it needs no password.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    profiles: [music]
    restart: unless-stopped
    environment:
      # The one script variant that works reliably, as its README says.
      OVERRIDE_PLAYER_VARIANT: IAS

volumes:
  postgres-data:
  redis-data:
  lavalink-plugins:
