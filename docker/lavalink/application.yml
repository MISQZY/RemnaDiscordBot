# Lavalink audio node for the music module (docker compose --profile music).
# The password comes from LAVALINK_SERVER_PASSWORD (see docker-compose.yml); the bot connects with LAVALINK_NODES.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  # Plugins are downloaded on startup into /opt/Lavalink/plugins.
  # youtube-plugin: YouTube and YouTube Music (ytsearch, ytmsearch). YouTube may block servers and its terms forbid
  # such playback: set YOUTUBE_ENABLED=false to turn it off.
  # LavaSrc: Spotify, Deezer and Yandex Music (spsearch, dzsearch, ymsearch), each on with its credentials (see below).
  plugins:
    # A snapshot of main: 1.18.2 has the TV client (the one OAuth plays with) rejected by YouTube with "The page needs
    # to be reloaded" (youtube-source#226, fixed in #233, not released yet). Back to a release once there is one.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    sources:
      # The built-in YouTube source is deprecated in favour of the plugin above.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: false
    soundcloudSearchEnabled: true
    gc-warnings: true
    # yt-cipher takes a while on a new YouTube player script: with the default timeouts TV playback fails with
    # "Read timed out" (as its README warns).
    timeouts:
      connectTimeoutMs: 10000
      connectionRequestTimeoutMs: 10000
      socketTimeoutMs: 10000

# Values from the container's environment (docker-compose.yml passes them from .env): ${NAME:default}.
plugins:
  youtube:
    enabled: ${YOUTUBE_ENABLED:true}
    allowSearch: true
    # Tried in order. YouTube asks servers to sign in ("This video requires login"): TV plays only with OAuth,
    # TVHTML5_SIMPLY without it.
    clients: ["MUSIC", "TV", "TVHTML5_SIMPLY", "ANDROID_VR", "WEB", "WEBEMBEDDED"]
    # Sign-in with a Google account (a spare one: YouTube may ban it). On with YOUTUBE_OAUTH=true and no token, the log
    # shows a code for google.com/device and then the refresh token to put into YOUTUBE_REFRESH_TOKEN.
    oauth:
      enabled: ${YOUTUBE_OAUTH:false}
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    # Stream signatures are deciphered by yt-cipher ("Must find sig function" without it): the compose service, or
    # another one by YOUTUBE_CIPHER_URL, e.g. the public https://cipher.kikkia.dev/.
    remoteCipher:
      url: "${YOUTUBE_CIPHER_URL:http://yt-cipher:8001}"
      userAgent: "remna-discord-bot"
  lavasrc:
    # Spotify gives no audio: its tracks play from YouTube Music, found by ISRC and then by title.
    providers:
      - "ytmsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
    # A source on without its credentials fails to start: each is on only when its variable says so.
    sources:
      spotify: ${SPOTIFY_ENABLED:false}
      deezer: ${DEEZER_ENABLED:false}
      yandexmusic: ${YANDEX_MUSIC_ENABLED:false}
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "${SPOTIFY_COUNTRY:US}"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      # Resolving artists asks /v1/artists?ids=, which Spotify closed to development mode apps in February 2026:
      # search would answer 403 (LavaSrc#351). Album links still fail on /v1/tracks?ids= until LavaSrc fixes it.
      resolveArtistsInSearch: false
    deezer:
      arl: "${DEEZER_ARL:}"
      masterDecryptionKey: "${DEEZER_MASTER_KEY:}"
      formats: ["MP3_128", "MP3_64"]
    yandexmusic:
      accessToken: "${YANDEX_MUSIC_TOKEN:}"
      playlistLoadLimit: 1
      albumLoadLimit: 1
      artistLoadLimit: 1

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: null
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
