packages:
  - apps/*
  - packages/*
  - packages/modules/*

overrides:
  deepmerge-ts: 8.0.2
  fast-uri@3: 3.1.9
  fast-uri@4: 4.2.3
  glob@13: 14.0.3
  minimatch@10: 11.0.4

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

peerDependencyRules:
  allowedVersions:
    # ioredis-mock does not import ioredis at runtime; the mock is only used in tests.
    ioredis-mock>ioredis: '6'
